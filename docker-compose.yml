services:
  mongo:
    image: mongo:6
    container_name: robot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    container_name: robot-mqtt
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-t", "test", "-m", "test"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: robot-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
      mqtt:
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: robot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  simulator:
    build: ./robot-simulator
    container_name: robot-simulator
    depends_on:
      mqtt:
    environment:
      - BROKER=mqtt
      - PORT=1883
    restart: unless-stopped

volumes:
  mongo-data:
  mosquitto-data:
  mosquitto-log:



